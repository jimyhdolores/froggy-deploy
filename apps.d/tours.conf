# Rutealo - gestion de tours y pasajes. https://rutealo.froggydevs.com
APP_NAME="Rutealo (app-tours)"
APP_REPO="https://github.com/jimyhdolores/app-tours.git"
APP_DIR="app-tours"

# DISCREPANCIA CONOCIDA: el clon de desarrollo esta en 'develop' y el HEAD remoto es 'main';
# no se sabe en que rama esta el servidor. deploy.sh ABORTA (exit 12) si el arbol del servidor
# esta en otra rama que esta. Antes del primer despliegue, comprobarlo:
#     ssh froggy 'git -C ~/apps/app-tours rev-parse --abbrev-ref HEAD'
# y o bien poner aqui esa rama, o cambiar el servidor a main a proposito. Fallar es lo
# correcto: desplegar a ciegas la rama equivocada es peor que no desplegar.
APP_BRANCH="main"
APP_TIERS="backend frontend"
APP_ENABLED="1"
APP_DB="app_tours_db"
APP_DB_BOOTSTRAP_SQL=""

TIER_backend_COMPOSE="infra/backend/docker-compose.yml"
TIER_backend_CONTAINER="tours-api"
TIER_backend_ENV_FILE="apps/backend-nestjs/.env"
TIER_backend_WAIT="90"

TIER_frontend_COMPOSE="infra/frontend/docker-compose.yml"
TIER_frontend_CONTAINER="tours-web"
TIER_frontend_ENV_FILE=""
TIER_frontend_WAIT="45"
