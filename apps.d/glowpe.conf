# Glowpe - SaaS multi-tenant de gestion de salones. https://glowpe.froggydevs.com
APP_NAME="Glowpe"
# URL SSH, no HTTPS: el servidor autentica contra GitHub con su propia clave (~/.ssh/root-jimy).
# Con HTTPS, un repositorio privado pediria credenciales por consola y el clone se colgaria en
# mitad del despliegue, sin terminal donde responder.
APP_REPO="git@github.com:jimyhdolores/app-glowpe.git"

# OJO: el repositorio se llama app-glowpe pero el directorio de despliegue es 'glowpe'.
# deploy.sh pasa APP_DIR como destino EXPLICITO del clone; sin eso, `git clone` crearia
# app-glowpe/ y todas las rutas de abajo apuntarian a un directorio inexistente.
APP_DIR="glowpe"
APP_BRANCH="main"
APP_TIERS="backend frontend"           # tambien fija el ORDEN de despliegue
APP_ENABLED="1"
APP_DB="app_glowpe_db"

# Esquemas globales (tenant, finance) y catalogos. Ruta relativa a la raiz del repo.
# ATENCION: este .sql NO es idempotente - hace DROP SCHEMA tenant/finance CASCADE. deploy.sh
# solo lo ejecuta si acaba de CREAR la base y esta no tiene esquemas de usuario. Los tenants
# NO se crean aqui: los crea el backend en runtime al dar de alta una empresa.
APP_DB_BOOTSTRAP_SQL="apps/backend/scripts/init-glowpe-db.sql"

# --- Modo registro y despliegue automatico ------------------------------------------------------
# Las imagenes las construye GitHub Actions (job `images` de .github/workflows/ci.yml) y las publica
# en GHCR con el SHA completo del commit; aqui solo se descargan. El job `deploy` de ese workflow
# llama a ci/entry.sh por SSH en cada push a main con las pruebas en verde.
APP_AUTO_DEPLOY="1"
# Un cambio en estas rutas es un cambio de esquema, y el despliegue automatico lo RETIENE (codigo 18)
# hasta un `deploy glowpe` manual: la ventana de migracion la lleva una persona
# (docs/operaciones-datos.md de glowpe). La comprobacion previa no basta para eso, porque la sonda de
# deriva no ve cambios de precision ni de escala.
APP_SCHEMA_PATHS="apps/backend/src/modules/tenant/db apps/backend/scripts/init-glowpe-db.sql :(glob)apps/backend/scripts/migrate-*"

TIER_backend_COMPOSE="infra/backend/docker-compose.yml"
TIER_backend_CONTAINER="glowpe-api"
# Ruta distinta a la de tours y barber: aqui la app se llama 'backend', no 'backend-nestjs'.
TIER_backend_ENV_FILE="apps/backend/.env"
# Es el unico contenedor con HEALTHCHECK, y su --start-period es de 45s. Ademas arranca con
# SCHEMA_DRIFT_STRICT=1, que aborta el proceso si el esquema no corresponde a las entidades.
TIER_backend_WAIT="120"
TIER_backend_IMAGE="ghcr.io/jimyhdolores/glowpe-api"
# Lo que copia infra/backend/Dockerfile: si cambia, la imagen cambia y --auto despliega el tier. Lo
# que entra al contexto pero no a la imagen final (pruebas, scripts de operacion, documentacion) no
# cuenta, para que un commit que solo toca eso no reinicie la API.
TIER_backend_SOURCES="package.json pnpm-lock.yaml pnpm-workspace.yaml .dockerignore packages apps/backend infra/backend :(exclude)apps/backend/test :(exclude)apps/backend/scripts :(exclude,glob)**/*.spec.ts :(exclude,glob)**/*.md"
# La imagen se comprueba contra la base antes de sustituir el contenedor que sirve: sale con 3 si sus
# entidades no encajan con el esquema de algun tenant (SCHEMA_CHECK_ONLY en apps/backend/src/main.ts).
TIER_backend_PREFLIGHT="1"

TIER_frontend_COMPOSE="infra/frontend/docker-compose.yml"
TIER_frontend_CONTAINER="glowpe-web"
TIER_frontend_ENV_FILE=""
TIER_frontend_WAIT="45"
TIER_frontend_IMAGE="ghcr.io/jimyhdolores/glowpe-web"
TIER_frontend_SOURCES="package.json pnpm-lock.yaml pnpm-workspace.yaml .dockerignore packages apps/frontend infra/frontend :(exclude,glob)**/*.spec.ts :(exclude,glob)**/*.md"
