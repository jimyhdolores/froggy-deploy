# Froggy Checkout - pasarela de pago compartida. https://pay.froggydevs.com
# La consumen app-tours y app-barber (ver CHECKOUT_WEB_ORIGIN en sus .env).
APP_NAME="Froggy Checkout"
APP_REPO="https://github.com/jimyhdolores/froggy-checkout.git"
APP_DIR="froggy-checkout"
APP_BRANCH="main"
APP_TIERS="web"                        # una sola capa: es un Angular suelto, sin backend
APP_ENABLED="1"
APP_DB=""
APP_DB_BOOTSTRAP_SQL=""

# Sin subnivel de tier: su compose esta en infra/, no en infra/web/, porque no es un monorepo
# (su build.context es `..`, un nivel, frente a `../..` del resto). Como TIER_*_COMPOSE es la
# ruta COMPLETA relativa a la raiz del repo, esta irregularidad no necesita ningun caso
# especial en deploy.sh: `docker compose -f` resuelve el contexto relativo al propio fichero.
TIER_web_COMPOSE="infra/docker-compose.yml"
TIER_web_CONTAINER="checkout-web"
TIER_web_ENV_FILE=""
TIER_web_WAIT="45"
